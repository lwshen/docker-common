name: Test Postgres Backup S3

on:
  workflow_dispatch:
  pull_request:
    paths:
      - postgres-backup-s3/**
      - postgres-restore-s3/**
      - postgres-restore-file/**
      - postgres-common/**
      - .dockerignore
      - .github/workflows/postgres-backup-s3-test.yml
      - .github/actions/setup-minio/**
  push:
    branches:
      - main
      - master
    paths:
      - postgres-backup-s3/**
      - postgres-restore-s3/**
      - postgres-restore-file/**
      - postgres-common/**
      - .dockerignore
      - .github/workflows/postgres-backup-s3-test.yml
      - .github/actions/setup-minio/**

jobs:
  validation_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Unit tests for failure handling and SQL preparation
        run: python3 -m unittest discover -s postgres-common/tests -v
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: PostgreSQL integration tests for restore preflight
        run: python3 postgres-common/tests/integration.py

  backup_test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up MinIO
        uses: ./.github/actions/setup-minio

      - name: Create test bucket
        run: |
          ./mc mb myminio/test-bucket

      - name: Setup test database
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -d test -c "CREATE TABLE test_table (id SERIAL PRIMARY KEY, name TEXT);"
          PGPASSWORD=postgres psql -h localhost -U postgres -d test -c "INSERT INTO test_table (name) VALUES ('test_data_1'), ('test_data_2'), ('test_data_3');"
          PGPASSWORD=postgres psql -h localhost -U postgres -d test -c "SELECT * FROM test_table;"

      - name: Build postgres-backup-s3 image
        run: |
          docker build -t postgres-backup-s3:test -f postgres-backup-s3/Dockerfile .

      - name: Test per-database archive bundles and restore policies
        run: |
          set -euo pipefail
          docker exec -u postgres ${{ job.services.postgres.id }} mkdir /tmp/backup-source-tablespace
          PGPASSWORD=postgres psql -X -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres <<'SQL'
          CREATE ROLE backup_login LOGIN PASSWORD 'source-login-password';
          CREATE ROLE backup_new_login LOGIN PASSWORD 'source-new-password';
          CREATE DATABASE backup_extra OWNER backup_login;
          CREATE TABLESPACE backup_source_space LOCATION '/tmp/backup-source-tablespace';
          GRANT CREATE ON TABLESPACE backup_source_space TO backup_login;
          SQL
          PGPASSWORD=postgres psql -X -v ON_ERROR_STOP=1 -h localhost -U postgres -d backup_extra <<'SQL'
          SET ROLE backup_login;
          CREATE TABLE extra_data (value TEXT) TABLESPACE backup_source_space;
          INSERT INTO extra_data VALUES ('second database restored');
          GRANT SELECT ON extra_data TO backup_new_login;
          SQL

          for mode in default include; do
            password_opts=()
            if [ "$mode" = include ]; then
              password_opts=(-e POSTGRES_DUMP_ROLE_PASSWORDS=true)
            fi
            docker run --rm --network=host \
              -e POSTGRES_DATABASE=all \
              -e POSTGRES_HOST=localhost \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_PASSWORD=postgres \
              -e S3_ACCESS_KEY_ID=minio_access_key \
              -e S3_SECRET_ACCESS_KEY=minio_secret_key \
              -e S3_BUCKET=test-bucket \
              -e S3_ENDPOINT=http://localhost:9000 \
              -e S3_PREFIX="backup-all-$mode" \
              "${password_opts[@]}" \
              postgres-backup-s3:test
            ./mc cp -r "myminio/test-bucket/backup-all-$mode/" "./backup-all-$mode/"
            mkdir "all-$mode"
            tar -xf ./backup-all-$mode/*/*.tar -C "all-$mode"
          done
          if grep -Eq '^ALTER ROLE .* PASSWORD ' all-default/roles.sql; then
            echo 'Default all-database backup unexpectedly includes role passwords'
            exit 1
          fi
          grep -Eq '^ALTER ROLE .* PASSWORD ' all-include/roles.sql
          extra_archive=$(python3 -c 'import json; print(json.load(open("all-default/manifest.json"))["databases"]["backup_extra"]["file"])')
          docker run --rm -v "$PWD/all-default:/backup:ro" --entrypoint pg_restore \
            postgres-backup-s3:test --schema-only --file /dev/stdout "/backup/$extra_archive" > all-schema.sql
          grep -q 'OWNER TO backup_login' all-schema.sql
          grep -q 'GRANT SELECT' all-schema.sql
          grep -q 'backup_source_space' all-schema.sql
          grep -q 'CREATE TABLESPACE backup_source_space' all-default/tablespaces.sql
          docker build -t postgres-restore-s3:bundle-test -f postgres-restore-s3/Dockerfile .
          docker build -t postgres-restore-file:bundle-test -f postgres-restore-file/Dockerfile .

          trap 'docker rm -f all-restore-target >/dev/null 2>&1 || true' EXIT
          docker run -d --name all-restore-target -p 127.0.0.1::5432 \
            -e POSTGRES_PASSWORD=target-admin-password postgres:18
          for attempt in {1..30}; do
            if docker exec all-restore-target pg_isready -h 127.0.0.1 -U postgres; then
              break
            fi
            sleep 1
          done
          docker exec -e PGPASSWORD=target-admin-password all-restore-target \
            psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres \
            -c "CREATE ROLE backup_login LOGIN PASSWORD 'target-login-password';"

          docker run --rm --network=host \
            -e POSTGRES_HOST=localhost -e POSTGRES_PORT="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "5432/tcp") 0).HostPort}}' all-restore-target)" \
            -e POSTGRES_DATABASE=postgres -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=target-admin-password \
            -e S3_ACCESS_KEY_ID=minio_access_key -e S3_SECRET_ACCESS_KEY=minio_secret_key \
            -e S3_BUCKET=test-bucket -e S3_ENDPOINT=http://localhost:9000 -e S3_PREFIX=backup-all-default \
            postgres-restore-s3:bundle-test
          test "$(docker exec -e PGPASSWORD=target-admin-password all-restore-target \
            psql -XAt -h 127.0.0.1 -U postgres -d test -c 'SELECT count(*) FROM test_table')" = 3
          test "$(docker exec -e PGPASSWORD=target-admin-password all-restore-target \
            psql -XAt -h 127.0.0.1 -U postgres -d backup_extra -c 'SELECT value FROM extra_data')" = 'second database restored'
          test "$(docker exec -e PGPASSWORD=target-admin-password all-restore-target \
            psql -XAt -h 127.0.0.1 -U postgres -d backup_extra \
            -c "SELECT tableowner FROM pg_tables WHERE schemaname = 'public' AND tablename = 'extra_data'")" = postgres
          test "$(docker exec -e PGPASSWORD=target-login-password all-restore-target \
            psql -XAt -h 127.0.0.1 -U backup_login -d postgres -c 'SELECT current_user')" = backup_login
          test "$(docker exec -e PGPASSWORD=target-admin-password all-restore-target \
            psql -XAt -h 127.0.0.1 -U postgres -d postgres \
            -c "SELECT count(*) FROM pg_roles WHERE rolname = 'backup_new_login'")" = 0

          # The same bundle can retain owners and grants, without restoring source storage paths.
          docker exec -e PGPASSWORD=target-admin-password all-restore-target \
            psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -c 'DROP DATABASE backup_extra'
          backup_files=("$PWD"/backup-all-default/*/*.tar)
          docker run --rm --network=container:all-restore-target \
            -v "${backup_files[0]}:/backup/all.tar:ro" -e BACKUP_FILE=/backup/all.tar \
            -e POSTGRES_HOST=127.0.0.1 -e POSTGRES_DATABASE=postgres \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=target-admin-password \
            -e RESTORE_DATABASE=backup_extra -e RESTORE_ROLES=true \
            -e RESTORE_NO_OWNER=false -e RESTORE_NO_ACL=false postgres-restore-file:bundle-test
          test "$(docker exec -e PGPASSWORD=target-admin-password all-restore-target \
            psql -XAt -h 127.0.0.1 -U postgres -d backup_extra \
            -c "SELECT tableowner FROM pg_tables WHERE tablename = 'extra_data'")" = backup_login
          test "$(docker exec -e PGPASSWORD=target-admin-password all-restore-target \
            psql -XAt -h 127.0.0.1 -U postgres -d backup_extra \
            -c "SELECT has_table_privilege('backup_new_login','extra_data','SELECT')")" = t

      - name: Run backup
        run: |
          docker run --network=host \
            -e POSTGRES_DATABASE=test \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e S3_ACCESS_KEY_ID=minio_access_key \
            -e S3_SECRET_ACCESS_KEY=minio_secret_key \
            -e S3_BUCKET=test-bucket \
            -e S3_ENDPOINT=http://localhost:9000 \
            -e S3_S3V4=yes \
            postgres-backup-s3:test

      - name: Verify basic backup exists
        run: |
          ./mc ls --recursive myminio/test-bucket/backup/
          ./mc cp -r myminio/test-bucket/backup/ ./backup/

      - name: Archive backup file
        uses: actions/upload-artifact@v4
        with:
          name: backup-file
          path: |
            backup/

      - name: Test encrypted backup
        run: |
          docker run --network=host \
            -e POSTGRES_DATABASE=test \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e S3_ACCESS_KEY_ID=minio_access_key \
            -e S3_SECRET_ACCESS_KEY=minio_secret_key \
            -e S3_BUCKET=test-bucket \
            -e S3_ENDPOINT=http://localhost:9000 \
            -e S3_S3V4=yes \
            -e S3_PREFIX=backup-encrypted \
            -e ENCRYPTION_PASSWORD=test_password \
            postgres-backup-s3:test

      - name: Verify encrypted backup exists
        run: |
          ./mc ls --recursive myminio/test-bucket/backup-encrypted/
          ./mc cp -r myminio/test-bucket/backup-encrypted/ ./backup-encrypted/

      - name: Archive encrypted backup file
        uses: actions/upload-artifact@v4
        with:
          name: backup-encrypted-file
          path: |
            backup-encrypted/

      - name: Test scheduled backup
        run: |
          set -euo pipefail
          # Clean up previous backups
          ./mc rm --recursive --force myminio/test-bucket/backup-scheduled/

          # Add more data to test database
          PGPASSWORD=postgres psql -h localhost -U postgres -d test -c "INSERT INTO test_table (name) VALUES ('scheduled_backup_test');"

          # The first scheduled run is a minute away, so startup must create a backup first.
          docker run -d --name scheduled-backup --network=host \
            -e POSTGRES_DATABASE=test \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e S3_ACCESS_KEY_ID=minio_access_key \
            -e S3_SECRET_ACCESS_KEY=minio_secret_key \
            -e S3_BUCKET=test-bucket \
            -e S3_ENDPOINT=http://localhost:9000 \
            -e S3_S3V4=yes \
            -e S3_PREFIX=backup-scheduled \
            -e SCHEDULE="@every 1m" \
            postgres-backup-s3:test

          echo "Waiting for the immediate startup backup..."
          for i in {1..30}; do
            BACKUP_COUNT=$(./mc ls --recursive myminio/test-bucket/backup-scheduled/ | awk '/[.]sql[.]gz$/ {count++} END {print count+0}')
            if [ "$BACKUP_COUNT" -ge 1 ]; then
              echo "Startup backup created successfully!"
              break
            fi
            if [ "$i" -eq 30 ]; then
              docker logs scheduled-backup
              echo "Startup backup not created within expected time!"
              exit 1
            fi
            sleep 1
          done

          # Require another backup so the startup backup cannot satisfy this check.
          echo "Waiting for scheduled backup to run..."
          for i in {1..7}; do
            sleep 10
            ./mc ls --recursive myminio/test-bucket/backup-scheduled/
            BACKUP_COUNT=$(./mc ls --recursive myminio/test-bucket/backup-scheduled/ | awk '/[.]sql[.]gz$/ {count++} END {print count+0}')
            if [ "$BACKUP_COUNT" -ge 2 ]; then
              echo "✅ Scheduled backup created successfully!"
              break
            fi
            if [ $i -eq 7 ]; then
              echo "❌ Scheduled backup not created within expected time!"
              exit 1
            fi
            echo "Still waiting... ($i/7)"
          done

          # Stop the scheduled backup container
          docker stop scheduled-backup
          docker rm scheduled-backup

      - name: Verify encrypted backup exists
        run: |
          ./mc ls --recursive myminio/test-bucket/backup-scheduled/
          ./mc cp -r myminio/test-bucket/backup-scheduled/ ./backup-scheduled/

      - name: Archive encrypted backup file
        uses: actions/upload-artifact@v4
        with:
          name: backup-scheduled-file
          path: |
            backup-scheduled/

      - name: Test DELETE_OLDER_THAN feature
        run: |
          # Create multiple backups first (without DELETE_OLDER_THAN)
          echo "Creating first backup..."
          docker run --network=host \
            -e POSTGRES_DATABASE=test \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e S3_ACCESS_KEY_ID=minio_access_key \
            -e S3_SECRET_ACCESS_KEY=minio_secret_key \
            -e S3_BUCKET=test-bucket \
            -e S3_ENDPOINT=http://localhost:9000 \
            -e S3_S3V4=yes \
            -e S3_PREFIX=backup-retention \
            postgres-backup-s3:test

          # Use a fixed cutoff between backups rather than a moving age threshold.
          sleep 2
          RETENTION_CUTOFF=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          echo "Creating second backup..."
          docker run --network=host \
            -e POSTGRES_DATABASE=test \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e S3_ACCESS_KEY_ID=minio_access_key \
            -e S3_SECRET_ACCESS_KEY=minio_secret_key \
            -e S3_BUCKET=test-bucket \
            -e S3_ENDPOINT=http://localhost:9000 \
            -e S3_S3V4=yes \
            -e S3_PREFIX=backup-retention \
            postgres-backup-s3:test

          # Verify we have 2 backups before cleanup
          BACKUPS_BEFORE=$(./mc ls --recursive myminio/test-bucket/backup-retention/ | grep ".sql.gz" | wc -l)
          echo "Backups before cleanup: $BACKUPS_BEFORE"

          # The first backup predates the cutoff; the second and cleanup backups do not.
          echo "Running cleanup backup..."
          docker run --network=host \
            -e POSTGRES_DATABASE=test \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e S3_ACCESS_KEY_ID=minio_access_key \
            -e S3_SECRET_ACCESS_KEY=minio_secret_key \
            -e S3_BUCKET=test-bucket \
            -e S3_ENDPOINT=http://localhost:9000 \
            -e S3_S3V4=yes \
            -e S3_PREFIX=backup-retention \
            -e DELETE_OLDER_THAN="$RETENTION_CUTOFF" \
            postgres-backup-s3:test

          # Verify that old backups were removed but recent ones remain
          echo "Verifying backup retention..."
          BACKUPS_AFTER=$(./mc ls --recursive myminio/test-bucket/backup-retention/ | grep ".sql.gz" | wc -l)
          echo "Backups after cleanup: $BACKUPS_AFTER"
          if [ "$BACKUPS_AFTER" -eq 2 ]; then
            echo "✅ DELETE_OLDER_THAN feature working correctly!"
            echo "Old backup removed, recent backups preserved."
          else
            echo "❌ DELETE_OLDER_THAN feature failed! Expected 2 backups, found $BACKUPS_AFTER."
            echo "Current backups:"
            ./mc ls --recursive myminio/test-bucket/backup-retention/
            exit 1
          fi

  restore_s3_test:
    needs: backup_test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Download backup file
        uses: actions/download-artifact@v4
        with:
          name: backup-file
          path: backup

      - name: Download encrypted backup file
        uses: actions/download-artifact@v4
        with:
          name: backup-encrypted-file
          path: backup-encrypted

      - name: Download scheduled backup file
        uses: actions/download-artifact@v4
        with:
          name: backup-scheduled-file
          path: backup-scheduled

      - name: Set up MinIO
        uses: ./.github/actions/setup-minio

      - name: Populate MinIO with backup artifacts
        run: |
          ./mc mb myminio/test-bucket
          ./mc cp -r backup/ myminio/test-bucket/backup/
          ./mc ls --recursive myminio/test-bucket/backup/
          ./mc cp -r backup-encrypted/ myminio/test-bucket/backup-encrypted/
          ./mc ls --recursive myminio/test-bucket/backup-encrypted/
          ./mc cp -r backup-scheduled/ myminio/test-bucket/backup-scheduled/
          ./mc ls --recursive myminio/test-bucket/backup-scheduled/

      - name: Build postgres-restore-s3 image
        run: |
          docker build -t postgres-restore-s3:test -f postgres-restore-s3/Dockerfile .

      - name: Test restore from basic backup
        run: |
          # Create a new database for testing
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE restore_test;"

          # Restore from the basic backup
          docker run --network=host \
            -e POSTGRES_DATABASE=restore_test \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e S3_ACCESS_KEY_ID=minio_access_key \
            -e S3_SECRET_ACCESS_KEY=minio_secret_key \
            -e S3_BUCKET=test-bucket \
            -e S3_ENDPOINT=http://localhost:9000 \
            -e S3_S3V4=yes \
            -e S3_PREFIX=backup \
            postgres-restore-s3:test

          # Verify the restored data
          PGPASSWORD=postgres psql -h localhost -U postgres -d restore_test -c "SELECT * FROM test_table;" > restored_data.txt
          cat restored_data.txt
          if grep -q "test_data_1" restored_data.txt && grep -q "test_data_2" restored_data.txt && grep -q "test_data_3" restored_data.txt; then
            echo "✅ Basic backup restore successful!"
          else
            echo "❌ Basic backup restore failed!"
            exit 1
          fi

      - name: Test restore from encrypted backup
        run: |
          # Create a new database for testing
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE encrypted_restore_test;"

          # Restore from the encrypted backup
          docker run --network=host \
            -e POSTGRES_DATABASE=encrypted_restore_test \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e S3_ACCESS_KEY_ID=minio_access_key \
            -e S3_SECRET_ACCESS_KEY=minio_secret_key \
            -e S3_BUCKET=test-bucket \
            -e S3_ENDPOINT=http://localhost:9000 \
            -e S3_S3V4=yes \
            -e S3_PREFIX=backup-encrypted \
            -e ENCRYPTION_PASSWORD=test_password \
            postgres-restore-s3:test

          # Verify the restored data
          PGPASSWORD=postgres psql -h localhost -U postgres -d encrypted_restore_test -c "SELECT * FROM test_table;" > encrypted_restored_data.txt
          cat encrypted_restored_data.txt
          if grep -q "test_data_1" encrypted_restored_data.txt && grep -q "test_data_2" encrypted_restored_data.txt && grep -q "test_data_3" encrypted_restored_data.txt; then
            echo "✅ Encrypted backup restore successful!"
          else
            echo "❌ Encrypted backup restore failed!"
            exit 1
          fi

      - name: Test restore from scheduled backup
        run: |
          # Create a new database for testing
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE scheduled_restore_test;"

          # Restore from the scheduled backup
          docker run --network=host \
            -e POSTGRES_DATABASE=scheduled_restore_test \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e S3_ACCESS_KEY_ID=minio_access_key \
            -e S3_SECRET_ACCESS_KEY=minio_secret_key \
            -e S3_BUCKET=test-bucket \
            -e S3_ENDPOINT=http://localhost:9000 \
            -e S3_S3V4=yes \
            -e S3_PREFIX=backup-scheduled \
            postgres-restore-s3:test

          # Verify the restored data includes the scheduled backup test record
          PGPASSWORD=postgres psql -h localhost -U postgres -d scheduled_restore_test -c "SELECT * FROM test_table;" > scheduled_restored_data.txt
          cat scheduled_restored_data.txt
          if grep -q "scheduled_backup_test" scheduled_restored_data.txt; then
            echo "✅ Scheduled backup restore successful!"
          else
            echo "❌ Scheduled backup restore failed!"
            exit 1
          fi

  restore_file_test:
    needs: backup_test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Download backup file
        uses: actions/download-artifact@v4
        with:
          name: backup-file
          path: backup

      - name: Extract backup file
        run: |
          gunzip $(ls ./backup/*/*.sql.gz | head -n 1) -c > ./backup/dump.sql

      - name: Build postgres-restore-file image
        run: |
          docker build -t postgres-restore-file:test -f postgres-restore-file/Dockerfile .

      - name: Test restore from file
        run: |
          # Create a new database for testing
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE file_restore_test;"

          # Restore from the file backup
          docker run --network=host \
            -e POSTGRES_DATABASE=file_restore_test \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -v $(pwd)/backup:/backup \
            postgres-restore-file:test

          # Verify the restored data
          PGPASSWORD=postgres psql -h localhost -U postgres -d file_restore_test -c "SELECT * FROM test_table;" > file_restored_data.txt
          cat file_restored_data.txt
          if grep -q "test_data_1" file_restored_data.txt && grep -q "test_data_2" file_restored_data.txt && grep -q "test_data_3" file_restored_data.txt; then
            echo "✅ File backup restore successful!"
          else
            echo "❌ File backup restore failed!"
            exit 1
          fi
